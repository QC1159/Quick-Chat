<!DOCTYPE html>
<html lang="en">
<head>
  <script>
      // Redirect immediately if token is present
      (function () {
          const value = `; ${document.cookie}`;
          const parts = value.split(`; token=`);
          if (parts.length !== 2) {
              window.location.replace('./login.html'); // replace() avoids adding to history
          }
      })();
  </script>

  <!-- Add mobile-detection script (minimal, fast) -->
  <script>
    (function detectMobile() {
      try {
        const ua = navigator.userAgent || '';
        const isUserAgentMobile = /Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(ua);
        const isTouch = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
        const smallScreen = Math.min(window.screen.width || Infinity, window.screen.height || Infinity) <= 700;
        const urlParamMobile = new URLSearchParams(window.location.search).get('mobile') === "1";
        if (isUserAgentMobile || isTouch || smallScreen || urlParamMobile) {
          document.documentElement.classList.add('mobile'); // apply to <html> for broader selectors
          document.body.classList.add('mobile'); // ensure body also has class
          document.documentElement.setAttribute('data-is-mobile', 'true');
        }
        console.log("Mobile: " + isUserAgentMobile);
      } catch (e) {
        // silent fallback
      }
    })();
  </script>

  <style>
      :root {
          --bg-main: #111217;
          --bg-secondary: #1e1f25;
          --bg-tertiary: #2a2b31;

          --border-main: #1e1f25;
          --border-soft: #2a2b31;

          --text-main: #e0e0e0;
          --text-muted: #9ca3af;

          --accent: #2563eb;
      }

      /* Light theme */
      [data-theme="light"] {
          --bg-main: #f3f4f6;
          --bg-secondary: #ffffff;
          --bg-tertiary: #e5e7eb;

          --border-main: #d1d5db;
          --border-soft: #e5e7eb;

          --text-main: #111827;
          --text-muted: #4b5563;

          --accent: #2563eb;
      }

      /* Midnight theme */
      [data-theme="midnight"] {
          --bg-main: #05060a;
          --bg-secondary: #0b0d14;
          --bg-tertiary: #141726;

          --border-main: #0f1220;
          --border-soft: #1c1f36;

          --text-main: #e5e7eb;
          --text-muted: #94a3b8;

          --accent: #6366f1;
      }

      /* Solarized theme */
      [data-theme="solarized"] {
          --bg-main: #fdf6e3;
          --bg-secondary: #eee8d5;
          --bg-tertiary: #f5f1dc;

          --border-main: #eee8d5;
          --border-soft: #f5f1dc;

          --text-main: #657b83;
          --text-muted: #93a1a1;

          --accent: #b58900;
      }

      /* Forest theme */
      [data-theme="forest"] {
          --bg-main: #0b1f0b;
          --bg-secondary: #123212;
          --bg-tertiary: #1b3a1b;

          --border-main: #123212;
          --border-soft: #1b3a1b;

          --text-main: #cdeac0;
          --text-muted: #8db68c;

          --accent: #22c55e;
      }

      /* Neon theme */
      [data-theme="neon"] {
          --bg-main: #0f0f1a; /* Very dark background to make neon pop */
          --bg-secondary: #1a1a2e;
          --bg-tertiary: #22223b;

          --border-main: #ff00ff; /* Neon magenta border */
          --border-soft: #00ffff; /* Neon cyan softer borders */

          --text-main: #39ff14; /* Bright neon green */
          --text-muted: #ff4dff; /* Neon pink for secondary text */

          --accent: #00ffff; /* Neon cyan for buttons, highlights */
      }

      html, body {
          overflow-x: hidden;
          height: 100%;
          margin: 0;
      }

      body {
          background: radial-gradient(circle at top left, var(--bg-tertiary), var(--bg-main));
          color: var(--text-main);
          font-family: 'Inter', sans-serif;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
          width: 8px;
      }

      ::-webkit-scrollbar-thumb {
          background: #2f3136;
          border-radius: 8px;
      }

      /* Chat message bubble */
      .message {
          transition: background-color 0.2s;
      }

      .message:hover {
          background-color: rgba(255, 255, 255, 0.05);
      }

      .fade-out {
          opacity: 0;
          pointer-events: none; /* prevents interaction after fading */
          transition: opacity 350ms ease; /* controls the fade duration */
      }

      iframe {
          pointer-events: none;
      }

      #cropContainer {
          max-width: 100%;
          max-height: calc(100% - 100px);
          aspect-ratio: 1;
          margin: auto;
          position: relative;
          border-radius: 50%;
          overflow: hidden;
          background: #111;
          cursor: grab;
      }

      #cropContainer:active {
          cursor: grabbing;
      }

      #previewImage {
          position: absolute;
          top: 0;
          left: 0;
          transform-origin: 0 0;
          will-change: transform;
      }


      .crop-border {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 3px solid rgba(255, 255, 255, 0.8);
          pointer-events: none;
      }

      .room-crop-border {
          position: absolute;
          inset: 0;
          border-radius: 10%;
          border: 3px solid rgba(255, 255, 255, 0.8);
          pointer-events: none;
      }

      #roomCropContainer {
          width: 220px;
          height: 220px;
          margin: auto;
          position: relative;
          border-radius: 10%;
          overflow: hidden;
          background: #111;
          cursor: grab;
      }

      #roomCropContainer:active {
          cursor: grabbing;
      }

      #roomPreviewImage {
          position: absolute;
          top: 0;
          left: 0;
          max-width: none;
          max-height: none;
      }

      .message .delete-btn {
          opacity: 0;
          transition: opacity 0.15s ease;
          position: absolute;
          right: 0;
          top: 50%;
          transform: translateY(-50%);
      }

      .message:hover .delete-btn {
          opacity: 1;
      }


      #gifResults {
          position: relative;
          flex: 1;
          overflow-y: auto;
          overflow-x: hidden;
      }

      .gif-item {
          position: absolute;
          width: 120px; /* column width */
          margin-bottom: 10px;
      }

      .gif-item img {
          width: 100%;
          height: auto;
          display: block;
          border-radius: 8px;
          cursor: pointer;
      }
  </style>

    function openPopup({ title, bodyHTML, confirmText = "Confirm", onConfirm }) {

        confirmBtn.textContent = confirmText;

        // Remove old click handlers
        const newBtn = confirmBtn.cloneNode(true);
        confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);

        // Add new handler
        newBtn.onclick = onConfirm;

        // Cancel button always closes
        document.getElementById("popupCancelBtn").onclick = closePopup;

        document.getElementById("universalPopup").classList.remove("hidden");

        const popup = document.getElementById("universalPopup");
        const popupContainer = document.querySelector(".popup-container");

        popup.onmousedown = (e) => {
            if (!popupContainer.contains(e.target)) {
                closePopup();

            dragging = true;

            startMouseY = e.clientY;
            startOffsetX = offsetX;
            startOffsetY = offsetY;
        });

        zoom.addEventListener("input", () => {
            const prevScale = scale;
            scale = Math.max(+zoom.value, minScale);

            // Crop center in container space
            const cx = CROP_SIZE / 2;

            // Image pixel currently at crop center

        if (contextRoomId !== null) {
            addInvite(contextRoomId);
        }

    function showRoomContextMenu(e, roomId) {
        e.preventDefault();
        contextRoomId = roomId;

        const menu = document.getElementById("room-context-menu");
        menu.style.left = `${e.pageX}px`;
        menu.style.top = `${e.pageY}px`;
        menu.classList.remove("hidden");
    }

    function leaveRoom(roomId) {
        if (confirm("Are you sure you want to leave this room?")) {
            ws.send(JSON.stringify({type: "leave_room", room_id: roomId}));

            // Optimistically remove the room from the sidebar
            const roomElem = document.getElementById("room-" + roomId);
            if (roomElem) {
                roomElem.remove();
            }
        }
    }

    function addInvite(roomId) {
        getInvites(roomId);
        openCreateInvitePopup()
    }

    function copyInvite(id) {
        const text = document.getElementById("invite-link-" + id).innerText;
        navigator.clipboard.writeText(text).then(() => {
            const button = document.getElementById("invite-button-" + id);
            button.innerText = "Copied!";

            setTimeout(() => {
                button.innerText = "Copy";
            }, 2000);
        }).catch(() => {
            alert("Failed to copy invite link.");
        });
    }

    function getInvites(roomId) {
        ws.send(JSON.stringify({type: "get_invites", room_id: roomId}));
    }

    function createInvite() {
        ws.send(JSON.stringify({type: "create_invite", room_id: contextRoomId}));
    }
</script>
<script>
    const gifPicker = document.getElementById("gifPicker");
    const gifResults = document.getElementById("gifResults");
    const gifSearch = document.getElementById("gifSearch");

    let gifQuery = "";
    let gifPage = 1;
    let gifLoading = false;
    let gifHasMore = true;
    let gifPreloadPage = 2; // always stay one page ahead
    let requestedPages = new Set();

    function requestGifPage(page) {
        if (!gifHasMore) return;
        if (requestedPages.has(page)) return;

        gifLoading = true;
        requestedPages.add(page);

        if (gifQuery) {
            ws.send(JSON.stringify({
                type: "gif_search",
                query: gifQuery,
                page: page
            }));
        } else {
            ws.send(JSON.stringify({
                type: "trending_gifs",
                page: page
            }));
        }

        if (page === 1) {
            if (!requestedPages.has(2)) {
                requestedPages.add(2);
                if (gifQuery) {
                    ws.send(JSON.stringify({
                        type: "gif_search",
                        query: gifQuery,
                        page: 2
                    }));
                } else {
                    ws.send(JSON.stringify({
                        type: "trending_gifs",
                        page: 2
                    }));
                }
            }
            if (!requestedPages.has(3)) {
                requestedPages.add(3);
                if (gifQuery) {
                    ws.send(JSON.stringify({
                        type: "gif_search",
                        query: gifQuery,
                        page: 3
                    }));
                } else {
                    ws.send(JSON.stringify({
                        type: "trending_gifs",
                        page: 3
                    }));
                }
            }
        }
    }


    function openGifPicker() {
        requestedPages.clear()
        gifQuery = ""
        gifPage = 1
        gifLoading = false;
        gifHasMore = true;
        gifPicker.classList.remove("hidden");
        gifSearch.value = "";
        gifResults.innerHTML = "";
        gifSearch.focus();
        requestGifPage(1)
    }

    function closeGifPicker() {
        gifPicker.classList.add("hidden");
    }

    let searchTimeout;
    gifSearch.addEventListener("input", () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            gifQuery = gifSearch.value.trim();

            gifResults.innerHTML = "";
            gifPage = 1;
            gifHasMore = true;
            requestedPages.clear();

            requestGifPage(1);
        }, 500);
    });


    gifResults.addEventListener("scroll", () => {
        const nearBottom =
            gifResults.scrollTop + gifResults.clientHeight >= gifResults.scrollHeight - 200;

        if (nearBottom && !gifLoading && gifHasMore) {
            gifPage++;
            requestGifPage(gifPage);
        }
    });

    function selectGif(url) {
        uploadedImageDataURL = url; // reuse your existing image system
        previewImage.src = url;
        previewContainer.style.display = "block";
        closeGifPicker();
    }
</script>

    function layoutMasonry() {
        const container = gifResults;
        const items = [...container.children];

        // Use fewer columns on mobile for better fit
        const columns = (document.documentElement.classList.contains('mobile') || document.body.classList.contains('mobile')) ? 2 : 3;
        const gap = 10;

        const containerWidth = container.clientWidth;
        const columnWidth = (containerWidth - gap * (columns - 1)) / columns;

        const colHeights = new Array(columns).fill(0);

        items.forEach(item => {
            // allow CSS fallback width but prefer computed columnWidth
            item.style.width = columnWidth + "px";

            const shortestCol = colHeights.indexOf(Math.min(...colHeights));

            const x = shortestCol * (columnWidth + gap);
            const y = colHeights[shortestCol];

            item.style.transform = `translate(${x}px, ${y}px)`;

            colHeights[shortestCol] += item.offsetHeight + gap;
        });

        container.style.height = Math.max(...colHeights) + "px";
    }

    let CROP_SIZE = 0;

    let offsetX = 0;
    let offsetY = 0;

    let dragging = false;

    let startOffsetX, startOffsetY;

    /* ================= INIT ================= */
    function init() {
        img.style.position = "absolute";
        img.style.transformOrigin = "top left";

        img.style.maxWidth = "none";
        img.style.maxHeight = "none";

        minScale = Math.max(
            CROP_SIZE / img.naturalWidth,
            CROP_SIZE / img.naturalHeight
        );

        scale = minScale;

        zoom.min = minScale;
        zoom.max = minScale * 3;
        zoom.step = 0.001;
        zoom.value = scale;

        // center image
        offsetX = (CROP_SIZE - img.naturalWidth * scale) / 2;
        offsetY = (CROP_SIZE - img.naturalHeight * scale) / 2;

        apply();
    }

    /* ================= CLAMP ================= */
    function clamp() {
        const w = img.naturalWidth * scale;
        const h = img.naturalHeight * scale;

        const minX = CROP_SIZE - w;
        const minY = CROP_SIZE - h;

        offsetX = Math.min(0, Math.max(minX, offsetX));
        offsetY = Math.min(0, Math.max(minY, offsetY));
    }

    /* ================= APPLY ================= */
    function apply() {
        img.style.width = img.naturalWidth * scale + "px";
        img.style.height = img.naturalHeight * scale + "px";
        img.style.left = offsetX + "px";
        img.style.top = offsetY + "px";
    }

    /* ================= DRAG ================= */

    window.addEventListener("mouseup", () => dragging = false);

    window.addEventListener("mousemove", e => {
        if (!dragging) return;

        offsetX = startOffsetX + (e.clientX - startMouseX);
        offsetY = startOffsetY + (e.clientY - startMouseY);

        clamp();
        apply();
    });

        const canvas = document.createElement("canvas");
        canvas.width = CROP_SIZE;
        canvas.height = CROP_SIZE;
        const ctx = canvas.getContext("2d");

        // Calculate source rectangle in image space
        const sx = -offsetX / scale;
        const sy = -offsetY / scale;
        const sSize = CROP_SIZE / scale;

        ctx.drawImage(
            img,
            sx, sy, sSize, sSize,
            0, 0, CROP_SIZE, CROP_SIZE
        );

        // Convert to data URL (you can also use canvas.toBlob for better performance)
        const dataURL = canvas.toDataURL("image/png");

    const tooltip = document.getElementById('tooltip');

    // Keep one tooltip and a per-target cleanup handle
    let currentCleanup = null;

    function showTooltip(e, text) {
        const target = e.target;

        // Clear any previous tooltip bindings
        if (currentCleanup) currentCleanup();

        tooltip.textContent = text;
        tooltip.style.opacity = '1';

        const rect = target.getBoundingClientRect();
        tooltip.style.left = `${rect.right + 8}px`;
        tooltip.style.top = `${rect.top + rect.height / 2 - tooltip.offsetHeight / 2}px`;

        // AbortController ties all listeners together for easy cleanup
        const ac = new AbortController();
        const {signal} = ac;

        // Normal hide when leaving the element
        target.addEventListener('mouseleave', hideTooltip, {signal});

        // Bonus: if pointer is canceled (e.g., due to DOM changes), hide
        target.addEventListener('pointercancel', hideTooltip, {signal});

        // If page scrolls or resizes, optionally reposition or hide
        window.addEventListener('scroll', hideTooltip, {signal, passive: true});
        window.addEventListener('resize', hideTooltip, {signal, passive: true});

        // Observe the entire document for removals; also check isConnected
        const observer = new MutationObserver((mutations) => {
            // Fast path: target disconnected
            if (!target.isConnected) {
                hideTooltip();
                cleanup();
                return;
            }
            // Removal path: target explicitly in removedNodes
            for (const m of mutations) {
                for (const removed of m.removedNodes) {
                    if (removed === target || (removed.nodeType === 1 && removed.contains(target))) {
                        hideTooltip();
                        cleanup();
                        return;
                    }
                }
            }
        });

        observer.observe(document.body, {childList: true, subtree: true});

        // Optional: periodic guard for edge cases (e.g., shadow DOM moves)
        let rafId = null;
        const tick = () => {
            if (!target.isConnected) {
                hideTooltip();
                cleanup();
                return;
            }
            rafId = requestAnimationFrame(tick);
        };
        rafId = requestAnimationFrame(tick);

        // One-shot cleanup to avoid leaks
        function cleanup() {
            ac.abort();
            observer.disconnect();
            if (rafId) cancelAnimationFrame(rafId);
            currentCleanup = null;
        }

        currentCleanup = cleanup;
    }

    function hideTooltip() {
        tooltip.style.opacity = '0';
    }


    function sendMessage() {
        const input = document.getElementById('messageInput');

        const text = input.value.trim();
        if (!text && !uploadedImageDataURL) return;

        if (uploadedImageDataURL) {
            if (room) {
                ws.send(JSON.stringify({
                    type: "send_room_message",
                    room_id: connectedChat,
                    image_url: uploadedImageDataURL,
                    message: text
                }))
            } else {
                ws.send(JSON.stringify({
                    type: "send_private_message",
                    to: connectedChat,
                    image_url: uploadedImageDataURL,
                    message: text
                }))
            }

            removeImage()
        } else {
            if (room) {
                ws.send(JSON.stringify({
                    type: "send_room_message",
                    room_id: connectedChat,
                    message: text
                }))
            } else {
                ws.send(JSON.stringify({
                    type: "send_private_message",
                    to: connectedChat,
                    message: text
                }))
            }
        }

        input.value = '';
    }

    function isChatAtBottom(chat) {
        const threshold = 5;
        return chat.scrollTop + chat.clientHeight >= chat.scrollHeight - threshold;
    }

    function addMessage(sender, receiver, text, time, id, imageSRC = null, scrollToBottom = false) {
        const privateChatId = sender === username ? receiver : sender;
        const chat = document.getElementById(`chat-messages-private-${privateChatId}`);
        const atBottom = isChatAtBottom(chat);

        const div = document.createElement('div');
        div.className = 'message flex items-start space-x-3 min-w-0';
        div.id = id;

        const rawTime = time;
        time = formatDateTime(time);

        // Detect previous message
        let grouped = false;
        const prev = chat.lastElementChild;

        if (prev) {
            const prevSender = prev.dataset.sender;
            const prevTime = new Date(prev.dataset.timestamp).getTime();
            const currentTime = new Date(rawTime).getTime();

            if (prevSender === sender && (currentTime - prevTime) <= 60000) {
                grouped = true;
            }
        }

        div.dataset.sender = sender;
        div.dataset.timestamp = rawTime;

        if (text.startsWith("/")) {
            const parts = text.split(" ");
            if (parts[0] === "/invite" && parts.length >= 4) {
                const roomId = parts[2];
                const roomName = parts[3];
                const inviteId = parts[1];
                div.innerHTML = createMessageHTML({
                    sender,
                    time,
                    text: "",
                    imageSRC,
                    showDelete: sender === username,
                    id
                }, grouped, roomId, roomName, `join.html?code=${inviteId}`);
                chat.appendChild(div);

                if (atBottom || scrollToBottom) {
                    chat.scrollTop = chat.scrollHeight;
                }
                return;
            }
        }
        div.innerHTML = createMessageHTML({
            sender,
            time,
            text,
            imageSRC,
            showDelete: sender === username,
            id
        }, grouped);

        chat.appendChild(div);

        if (atBottom || scrollToBottom) {
            chat.scrollTop = chat.scrollHeight;
        }
    }


    function addRoomMessage(sender, room_id, text, time, id, imageSRC = null, scrollToBottom = false) {
        const chat = document.getElementById(`chat-messages-room-${room_id}`);
        const atBottom = isChatAtBottom(chat);

        const div = document.createElement('div');
        div.className = 'message flex items-start space-x-3 min-w-0';
        div.id = id;

        const rawTime = time;
        time = formatDateTime(time);

        // Detect previous message
        let grouped = false;
        const prev = chat.lastElementChild;

        if (prev) {
            const prevSender = prev.dataset.sender;
            const prevTime = new Date(prev.dataset.timestamp).getTime();
            const currentTime = new Date(rawTime).getTime();

            if (prevSender === sender && (currentTime - prevTime) <= 60000) {
                grouped = true;
            }
        }

        div.dataset.sender = sender;
        div.dataset.timestamp = rawTime;

        div.innerHTML = createMessageHTML({
            sender,
            time,
            text,
            imageSRC,
            showDelete: sender === username,
            id
        }, grouped);

        chat.appendChild(div);

        if (atBottom || scrollToBottom) {
            chat.scrollTop = chat.scrollHeight;
        }
    }


    function formatDateTime(isoString) {
        const inputDate = new Date(isoString);
        const now = new Date();

        const isToday =
            inputDate.getFullYear() === now.getFullYear() &&
            inputDate.getMonth() === now.getMonth() &&
            inputDate.getDate() === now.getDate();

        const optionsTime = {hour: '2-digit', minute: '2-digit', second: '2-digit'};
        const optionsDate = {year: 'numeric', month: 'short', day: 'numeric'};

        return isToday
            ? inputDate.toLocaleTimeString(undefined, optionsTime)
            : `${inputDate.toLocaleDateString(undefined, optionsDate)} ${inputDate.toLocaleTimeString(undefined, optionsTime)}`;
    }

    function changePassword() {
        const currentPassword = document.getElementById('ChangePasswordCurrentPassword').value;
        const newPassword = document.getElementById('ChangePasswordNewPassword').value;
        const confirmPassword = document.getElementById('ChangePasswordConfirmNewPassword').value;

        if (!currentPassword || !newPassword || !confirmPassword) return;

        if (newPassword !== confirmPassword) {
            alert("New password and confirmation do not match.");
            return;
        }

        ws.send(JSON.stringify({
            type: "change_password",
            current_password: currentPassword,
            new_password: newPassword
        }));

        closePasswordPopup();
    }

    document.addEventListener("mousedown", (e) => {
        const target = e.target;

        const profilePopup = document.getElementById("profilePopup");
        const emojiPicker = document.getElementById("emojiPicker");
        const gifPickerMain = document.getElementById("gifPickerMain");
        const gifPicker = document.getElementById("gifPicker");
        const mobileMenu = document.getElementById("mobileMenu");

        if (profilePopup && !profilePopup.contains(target) && !target.closest("#profileButton")) {
            profilePopup.classList.add("hidden");
        }

        if (emojiPicker && !emojiPicker.contains(target)) {
            emojiPicker.style.display = "none";
        }

        if (gifPickerMain && gifPicker && !gifPickerMain.contains(target)) {
            gifPicker.classList.add("hidden");
        }

        if (mobileMenu) {
            if (!mobileMenu.contains(target)) {
                mobileMenu.classList.add("hidden");
            } else {
                setTimeout(() => mobileMenu.classList.add("hidden"), 100);
            }
        }
    });

    function sendInviteToFriend(friendName, contextInviteId) {
        // we have to send a message to the server as if we were sending a normal message to another user, but the message will contain a /invite command that the other client will interpret and make the invite card
        ws.send(JSON.stringify({
            type: "send_private_message",
            to: friendName,
            message: `/invite ${contextInviteId} ${contextRoomId} ${roomNames.find(r => r[0] === contextRoomId)[1]}`
        }));
    }
